 sx.forEach(xs=>{const p=[new T.Vector3(xs,r+.8,0),new T.Vector3(xs,r*.5,0)];
  for(let i=1;i<=nb;i++)if(i*bs>xs+.3)p.push(new T.Vector3(i*bs,(i%2?-.85:.85)*r,0));
  p.push(new T.Vector3(Ls-.6,-r*.6,0),new T.Vector3(.75,-r*.6,0),new T.Vector3(.75,-r-.75,0));
  const c=new T.CatmullRomCurve3(p,false,'centripetal');c.arcLengthDivisions=200;const L=c.getLength();
  for(let k=0;k<40;k++)PA.push({c,len:L,u:k/40,v:1.4,k:'s',zo:(rnd()-.5)*.6*r,s:1.5})});
 inst=new T.InstancedMesh(new T.SphereGeometry(.05,8,6),new T.MeshBasicMaterial({clippingPlanes:[plane]}),PA.length);inst.frustumCulled=false;
 PA.forEach((_,i)=>inst.setColorAt(i,CC));G.add(inst);
 // kính báo mực
 const gx=Ls*.7,gz=r+.5,gl=new T.Mesh(new T.CylinderGeometry(.06,.06,r*1.2,20),M(0xcfe6ff,'gl',{transparent:true,opacity:.35,depthWrite:false}));gl.position.set(gx,-r*.1,gz);G.add(gl);isoH.push(gl);
 const gf=new T.Mesh(new T.CylinderGeometry(.045,.045,r*.5,16),M(0x2a8cff,'gl'));gf.position.set(gx,-r*.45,gz);G.add(gf);isoH.push(gf);
 [-.45,.5].forEach(k=>{const p=new T.Mesh(new T.CylinderGeometry(.03,.03,.5,12).rotateX(Math.PI/2),dk);p.position.set(gx,r*k*.8,gz/2+.12);G.add(p);isoH.push(p)});
 lbls.push({o:G,loc:new T.Vector3(gx,r*.5,gz),k:'gl',t:'Kính báo mực'});
 // chân đỡ bo tròn + mặt sàn
 [1.0,Ls-1.7].forEach(x=>{const s=new T.Shape(),a0=Math.atan2(-Math.sqrt(1-.72),.85),zz=.85*r;
  s.moveTo(-zz,-r-.5);s.lineTo(zz,-r-.5);s.lineTo(zz,r*Math.sin(a0));s.absarc(0,0,r+.01,a0,Math.PI-a0-0,true);s.lineTo(-zz,-r-.5);
  const m=new T.Mesh(ex(s,.5,.03,48),new T.MeshStandardMaterial({color:0x37424f,metalness:.5,roughness:.5}));m.position.x=x;G.add(m)});
 const fl2=new T.Mesh(new T.BoxGeometry(Ls+ch+3,.1,r*4),new T.MeshStandardMaterial({color:0x8d99a6,metalness:.1,roughness:.9,transparent:true,opacity:.55}));fl2.position.set((Ls-ch)/2,-r-.6,0);G.add(fl2);
 ring=new T.Mesh(new T.RingGeometry(r-tt/2,r+tt/2,96).rotateY(Math.PI/2),new T.MeshBasicMaterial({color:0xff8a3d,side:T.DoubleSide}));G.add(ring);
 G.position.x=-(Ls-ch)/2;S.add(G);
 lbEls.forEach(e=>e.remove());lbEls=lbls.map(l=>{const e=document.createElement('span');e.className='lb';e.dataset.k=l.k;e.textContent=l.t;holder.appendChild(e);return e});
 const dd=(Ls*1.35+3)*Math.max(1,1.4/C.aspect);C.position.set(dd*.3,dd*.38,dd*.9);O.target.set(0,0,0);O.update();
 setMode(mode);$('#ghost').dispatchEvent(new Event('change'));explode();side(id)}

// ===== Tách rời, cô lập chi tiết, mô phỏng dòng =====
function applyVis(){const e=+$('#exp').value;isoH.forEach(o=>o.visible=!iso);wm.visible=!iso&&$('#wat').checked;bg.visible=$('#baf').checked;
 inst.visible=!iso&&$('#flow').checked&&e<.02;(parts.dsh||[]).concat(parts.dc||[]).forEach(m=>m.opacity=iso?.7:.32)}
function explode(){const e=+$('#exp').value;gChan.position.x=-e*2.8;gHead.position.x=e*2.4;gBun.position.y=e*(2.4*r+.3);gDSH.position.y=e*r*1.3;gDC.position.y=-e*r*.5;
 gNz.forEach(n=>{if(n.g.parent===G)n.g.position.y=n.y+n.d*e*1.2});applyVis()}
const mt=new T.Matrix4(),col=new T.Color(),vv=new T.Vector3(),cs1=new T.Color(0xfff0d0),cs2=new T.Color(0xffa24a),cs3=new T.Color(0x2f8dff);
function flowStep(dt){if(!inst||!inst.visible)return;const sp=+$('#spd').value;
 PA.forEach((p,i)=>{p.u=(p.u+dt*sp*p.v/p.len)%1;p.c.getPointAt(p.u,vv);vv.z+=p.zo;mt.makeScale(p.s,p.s,p.s);mt.setPosition(vv);inst.setMatrixAt(i,mt);
  if(p.k=='w')col.copy(CC).lerp(HC,Math.min(1,Math.max(0,(p.u-.25)/.5)));
  else if(p.u<.55)col.copy(cs2).lerp(cs1,p.u/.55);else col.copy(cs1).lerp(cs3,Math.min(1,(p.u-.55)/.2));
  inst.setColorAt(i,col)});inst.instanceMatrix.needsUpdate=true;inst.instanceColor.needsUpdate=true}

// ===== Mặt cắt =====
function applyCut(){const s=+$('#sl').value;
 if(mode=='none'){plane.normal.set(0,0,-1);plane.constant=1e4}
 else if(mode=='z'){plane.normal.set(0,0,-1);plane.constant=s}
 else{plane.normal.set(-1,0,0);plane.constant=G.position.x+s}
 ring.visible=mode=='x';ring.position.x=s}
function setMode(m){mode=m;const sl=$('#sl');
 if(m=='z'){sl.min=-r;sl.max=r;sl.step=.01;sl.value=0}else if(m=='x'){sl.min=0;sl.max=Ls;sl.step=.02;sl.value=Ls*.45}
 sl.disabled=m=='none';document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m==m));applyCut()}

// ===== Bảng thông số bên phải =====
function side(id){const h=D[id],hp=h.z[0][1]>0,Q=h.z.reduce((a,z)=>a+z[0],0)/3.6e6,[sf,sh,sT,sS]=h.st,dr=h.dr,fw=h.fw;
 const ttd=sS-fw[4],dca=dr[4]-fw[3],U=u=>f(u/3.6);
 const zr=(l,z,k)=>z[1]?`<tr class=hk data-k="${k}"><th>${l}</th><td>${f(z[1])}</td><td>${f(z[0]/1e6,1)}</td><td>${f(z[2],1)}</td><td>${U(z[3])}</td><td>${f(z[4])}</td></tr>`:'';
 const kr=(l,a,k)=>`<tr class=hk data-k="${k}"><th>${l}</th><td>${a}</td></tr>`;
 $('#side').innerHTML=`<h2>${id} · ${h.n}</h2><div class=sub>KKS ${h.k} · nằm ngang · ống chữ U · 2 hành trình · ${hp?'có vùng DSH':'không có vùng DSH'}</div>
 <div class=kp><div><b>${f(h.Ae,1)} m²</b><span>Diện tích TĐN hiệu dụng</span></div><div><b>${f(Q,1)} MW</b><span>Công suất nhiệt</span></div>
 <div><b>${f(fw[4]-fw[3],1)} °C</b><span>Độ gia nhiệt nước cấp</span></div><div><b>${f(h.N)}</b><span>Số ống U (Ø15,875)</span></div>
 <div><b>${f(h.dg[0],2)} / ${h.dg[1]} barg</b><span>Áp thiết kế vỏ / ống</span></div><div><b>${f(h.W[2]/1000,1)} tấn</b><span>Khối lượng khi ngập nước</span></div></div>
 <h3>Dải nhiệt độ nước cấp (màu ống)</h3><div class=bar></div><div><span>Vào ${fw[3]} °C</span><span>Ra ${fw[4]} °C</span></div>
 <h3>Thông số vận hành (1 bình)</h3><table><thead><tr><th></th><th>Phía vỏ (hơi)</th><th>Phía ống (nước cấp)</th></tr></thead><tbody>
 <tr><th>Lưu lượng, t/h</th><td>${f(sf/1000,1)}${dr[0]?' + drain '+f(dr[0]/1000,1):''}</td><td>${f(fw[0]/1000,1)}</td></tr>
 <tr><th>Nhiệt độ vào, °C</th><td>${sT} (bão hòa ${sS})</td><td>${fw[3]}</td></tr>
 <tr><th>Nhiệt độ ra, °C</th><td>${dr[4]} (drain)</td><td>${fw[4]}</td></tr>
 <tr><th>Entanpi vào, kJ/kg</th><td>${f(sh,1)}</td><td>${f(fw[1],1)}</td></tr>
 <tr><th>Entanpi ra, kJ/kg</th><td>${f(dr[2],1)}</td><td>${f(fw[2],1)}</td></tr>
 <tr><th>Áp suất vận hành, bara</th><td>${h.P[0]}</td><td>${h.P[1]}</td></tr>
 <tr><th>Tổn thất áp, bar</th><td>${hp?'DSH '+h.dp[0]+' · ':''}DC ${h.dp[1]}</td><td>${h.dp[2]} (VWO ${h.dp[3]})</td></tr>
 <tr><th>Tốc độ nước, m/s</th><td>–</td><td>${h.v[0]} (VWO ${h.v[1]})</td></tr></tbody></table>
 <h3>Các vùng trao đổi nhiệt (bấm để làm nổi bật)</h3><table><thead><tr><th>Vùng</th><th>A m²</th><th>Q GJ/h</th><th>LMTD</th><th>U W/m²K</th><th>Vách mm</th></tr></thead><tbody>
 ${zr('Hạ nhiệt hơi (DSH)',h.z[0],'dsh')}${zr('Ngưng hơi',h.z[1],'tube')}${zr('Làm mát drain (DC)',h.z[2],'dc')}</tbody></table>
 <table style="margin-top:6px"><tbody><tr><th>TTD = T bão hòa − T nước cấp ra</th><td>${f(ttd,1)} °C</td></tr><tr><th>DCA = T drain ra − T nước cấp vào</th><td>${f(dca,1)} °C</td></tr></tbody></table>
 <h3>Kết cấu & vật liệu</h3><table><tbody>
 ${kr('Vỏ',`Ø trong ${f(h.ID)} × dày ${h.t} mm · ${h.m[0]}`,'shell')}${kr('Ống trao đổi nhiệt',`Ø15,875 × ${h.w} mm × ${f(h.L)} mm · ${h.m[2]}`,'tube')}
 ${kr('Bước ống','20,6375 mm, bố trí tam giác','tube')}${kr('Tấm ống (tubesheet)',h.m[1],'ts')}
 ${kr('Thử áp vỏ / ống',`${h.ts[0]} / ${h.ts[1]} barg`,'shell')}${kr('Nhiệt độ thiết kế vỏ / ống',`${h.T[0]} / ${h.T[1]} °C`,'shell')}
 ${kr('Khối lượng',`Bó ống ${f(h.W[1])} · Vỏ+bó ${f(h.W[0])} kg`,'tube')}${kr('Thể tích vỏ',h.V+' m³','water')}
 ${kr('Tiêu chuẩn','ASME Sec. VIII Div.1 · HEI','shell')}</tbody></table>
 <h3>Ống nối</h3><table><tbody>
 ${kr('Hơi trích vào',(h.nz[0]>1?h.nz[0]+' × ':'')+'DN'+h.nz[1],'steam')}${h.nz[2]?kr('Drain vào','DN'+h.nz[2],'din'):''}${kr('Drain ra','DN'+h.nz[3],'dout')}
 ${kr('Xả khẩn','DN'+h.nz[4],'emg')}${kr('Nước cấp vào / ra','DN'+h.nz[5]+' / DN'+h.nz[5],'fw')}${kr('Van an toàn vỏ & ống','Có','rv')}${kr('Kính báo mực','Có','gl')}</tbody></table>
 <div class=note><p><b>Cách đọc:</b> nước cấp đi trong ống (vào đáy, ra phía trên), hơi trích đi ở phía vỏ.</p>
 <p>${hp?'<b>DSH</b> lấy nhiệt hơi quá nhiệt. Hơi sau đó ngưng ở vùng giữa, rồi drain được <b>DC</b> làm mát thêm.':'Bình hạ áp chỉ có vùng ngưng và vùng làm mát drain (DC).'}</p>
 <p>${ttd<0?'TTD âm: nước cấp ra nóng hơn nhiệt độ bão hòa của hơi nhờ vùng DSH.':'TTD dương nhỏ: nước cấp ra gần chạm nhiệt độ bão hòa.'}</p>
 <p><b>Dòng chảy:</b> nước cấp (hạt xanh→đỏ) đi vào đáy buồng nước, qua chân dưới ống U, vòng lên chân trên rồi ra. Hơi (hạt cam→nhạt) vào vỏ, ngoặt qua các vách ngăn, ngưng thành nước (hạt xanh) rồi chảy về cửa drain. Kéo thanh <i>Tách rời</i> để tách các bộ phận (dòng chảy tạm ẩn).</p><p style="color:var(--mu)">Ống vẽ thưa và phóng to để dễ nhìn, không đúng số lượng/kích thước thật. Nguồn: tài liệu O&M kèm bảng thông số HYUNDAI E&C / SEDAE.</p></div>`}

// ===== Tương tác =====
function hl(k){(parts[k]||[]).forEach(m=>{m.emissive.setHex(0xff9a1f);m.emissiveIntensity=.85;clearTimeout(m._t);m._t=setTimeout(()=>m.emissive.setHex(0),1700)})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-k]');if(el)hl(el.dataset.k)});
$('#tabs').innerHTML=Object.keys(D).map(k=>`<button data-h="${k}"><b>${k}</b><i>${D[k].n}</i></button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;hid=b.dataset.h;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x==b));build(hid)};
$('#modes').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m)};
$('#sl').oninput=applyCut;
$('#ghost').onchange=e=>(parts.shell||[]).forEach(m=>{m.transparent=e.target.checked;m.opacity=e.target.checked?.22:1;m.depthWrite=!e.target.checked;m.needsUpdate=true});
$('#wat').onchange=applyVis;$('#baf').onchange=applyVis;$('#flow').onchange=applyVis;$('#exp').oninput=explode;
$('#iso').onclick=e=>{iso=!iso;e.currentTarget.classList.toggle('on',iso);applyVis()};
$('#auto').onchange=e=>O.autoRotate=e.target.checked;
function rs(){const w=holder.clientWidth,h=holder.clientHeight;if(!w||!h)return;R.setSize(w,h);C.aspect=w/h;C.updateProjectionMatrix()}
new ResizeObserver(rs).observe(holder);rs();
const V=new T.Vector3();
(function tick(){requestAnimationFrame(tick);const nw=performance.now(),dt=Math.min(.05,(nw-tLast)/1000);tLast=nw;flowStep(dt);O.update();R.render(S,C);const w=holder.clientWidth,h=holder.clientHeight,on=$('#lab').checked;
 lbls.forEach((l,i)=>{const e=lbEls[i];if(!e)return;V.copy(l.loc);l.o.localToWorld(V);V.project(C);
  const show=on&&l.t&&V.z<1&&(!iso||l.iso);e.style.display=show?'':'none';if(show){e.style.left=(V.x*.5+.5)*w+'px';e.style.top=(-V.y*.5+.5)*h+'px'}})})();
document.querySelector('#tabs button').classList.add('on');build('LP-3');
</script></body></html>
