<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đề Thi Giữ Bậc Máy Phó 2026</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            primary: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: text;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .page-transition {
      animation: fadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen font-sans flex flex-col antialiased">

  <!-- ==================== HEADER ĐIỀU HƯỚNG CỐ ĐỊNH ==================== -->
  <header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 shadow-sm transition-colors">
    <div class="max-w-xl mx-auto px-4 h-14 flex items-center justify-between">
      
      <!-- Cụm nút điều hướng Home & Back -->
      <div class="flex items-center gap-1.5" id="navControls">
        <!-- Nút Home: luôn đưa về danh mục chính -->
        <button id="btnHome" onclick="goHome()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-primary-50 text-primary-700 dark:bg-primary-950/60 dark:text-primary-300 border border-primary-200/50 dark:border-primary-800/50 active:scale-95 transition-all">
          <i class="fa-solid fa-house"></i>
          <span>Home</span>
        </button>

        <!-- Nút Back: quay lại màn hình trước -->
        <button id="btnBack" onclick="goBack()" class="hidden items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200 border border-slate-200 dark:border-slate-700 active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Back</span>
        </button>

        <!-- Logo/Tiêu đề khi ở trang Home -->
        <div id="homeBrand" class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-primary-600 text-white flex items-center justify-center font-bold text-sm shadow">
            <i class="fa-solid fa-bolt"></i>
          </div>
          <div>
            <h1 class="text-sm font-bold text-slate-900 dark:text-white leading-tight">Giữ Bậc Máy Phó 2026</h1>
            <p class="text-[10px] text-slate-500 font-medium">Sổ Tay Vận Hành & Khắc Phục Sự Cố</p>
          </div>
        </div>
      </div>

      <!-- Chuyển đổi Dark / Light Theme -->
      <button onclick="toggleDarkMode()" aria-label="Đổi giao diện sáng tối" class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <i id="themeIcon" class="fa-solid fa-moon text-base"></i>
      </button>
    </div>
  </header>

  <!-- ==================== VIEW 1: TRANG DANH MỤC CÂU HỎI (HOME) ==================== -->
  <main id="viewCatalog" class="flex-1 max-w-xl w-full mx-auto p-4 page-transition">
    
    <!-- Tiêu đề & Giới thiệu danh mục -->
    <div class="mb-4 p-4 rounded-2xl bg-gradient-to-br from-primary-700 via-primary-600 to-indigo-700 text-white shadow-md">
      <div class="flex items-center justify-between mb-1">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-primary-100">Đề cương sát hạch</span>
        <span class="text-[11px] font-mono bg-white/20 px-2 py-0.5 rounded-full font-bold">23 Câu</span>
      </div>
      <h2 class="text-base font-bold">Danh Sách Câu Hỏi Nghiệp Vụ</h2>
      <p class="text-xs text-primary-100/90 mt-1">Chạm vào từng câu hỏi bên dưới để mở trang đọc đáp án chi tiết.</p>
    </div>

    <!-- Thanh tìm kiếm nhanh & Bộ lọc hệ thống -->
    <div class="sticky top-14 z-30 bg-slate-100/95 dark:bg-slate-950/95 backdrop-blur-md pt-1 pb-3 space-y-2">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input 
          type="text" 
          id="searchBox" 
          placeholder="Tìm theo số câu hoặc nội dung (dầu EH, bình ngưng...)" 
          oninput="filterQuestions()"
          class="w-full pl-9 pr-9 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 shadow-sm"
        >
        <button id="btnResetSearch" onclick="resetSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Nhãn phân loại chuyên đề cuộn ngang -->
      <div class="flex gap-1.5 overflow-x-auto pb-0.5 hide-scrollbar text-[11px] font-semibold" id="categoryGroup">
        <button onclick="selectCategory('all', this)" class="cat-pill active-pill shrink-0 px-3 py-1.5 rounded-lg border transition-all">Tất cả (23)</button>
        <button onclick="selectCategory('tuabin', this)" class="cat-pill shrink-0 px-3 py-1.5 rounded-lg border transition-all">Tuabin & Dầu</button>
        <button onclick="selectCategory('nuoc', this)" class="cat-pill shrink-0 px-3 py-1.5 rounded-lg border transition-all">Nước cấp - Ngưng</button>
        <button onclick="selectCategory('binhngung', this)" class="cat-pill shrink-0 px-3 py-1.5 rounded-lg border transition-all">Bình ngưng & Khí</button>
        <button onclick="selectCategory('mayphat', this)" class="cat-pill shrink-0 px-3 py-1.5 rounded-lg border transition-all">Máy phát & Phụ</button>
      </div>
    </div>

    <!-- Số lượng kết quả -->
    <div class="flex justify-between items-center text-[11px] text-slate-500 dark:text-slate-400 px-1 mb-2 font-medium">
      <span id="labelTotalVisible">Hiển thị 23 câu hỏi</span>
      <span>Chạm để đọc</span>
    </div>

    <!-- Danh sách hiển thị câu hỏi (Chỉ tiêu đề) -->
    <div id="catalogList" class="space-y-2 pb-10">
      <!-- Được render tự động qua Javascript -->
    </div>
  </main>

  <!-- ==================== VIEW 2: TRANG ĐỌC ĐÁP ÁN CHI TIẾT (DETAIL PAGE) ==================== -->
  <main id="viewReader" class="hidden flex-1 max-w-xl w-full mx-auto p-4 page-transition pb-28">
    
    <!-- Thanh điều hướng nhỏ trên đầu trang đọc -->
    <div class="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 mb-2.5 font-medium">
      <button onclick="goHome()" class="flex items-center gap-1 text-primary-600 dark:text-primary-400 hover:underline">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        <span>Về danh mục</span>
      </button>
      <div class="flex items-center gap-2">
        <span id="detailCatBadge" class="bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-2 py-0.5 rounded text-[10px] font-bold">Tuabin & Dầu</span>
        <span id="detailScoreBadge" class="bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 px-2 py-0.5 rounded text-[10px] font-bold">3.0đ</span>
      </div>
    </div>

    <!-- Hộp tiêu đề câu hỏi -->
    <div class="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm mb-3">
      <div class="flex items-start gap-3">
        <div id="detailIndexTag" class="shrink-0 w-8 h-8 rounded-xl bg-primary-600 text-white font-bold flex items-center justify-center text-sm shadow">
          1
        </div>
        <h2 id="detailQuestionTitle" class="text-sm sm:text-base font-bold text-slate-900 dark:text-white leading-snug">
          <!-- Tên câu hỏi chi tiết -->
        </h2>
      </div>
    </div>

    <!-- Hộp nội dung trả lời chi tiết -->
    <div class="p-4 sm:p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2 text-primary-600 dark:text-primary-400">
          <i class="fa-solid fa-clipboard-check text-sm"></i>
          <span class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-200">Nội dung trả lời</span>
        </div>
        <button onclick="copyAnswer()" class="text-xs text-slate-500 hover:text-primary-600 dark:hover:text-primary-400 flex items-center gap-1.5 py-1 px-2.5 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 transition">
          <i class="fa-regular fa-copy"></i>
          <span>Sao chép</span>
        </button>
      </div>

      <!-- Bài làm / Đáp án -->
      <article id="detailAnswerBody" class="text-xs sm:text-sm leading-relaxed space-y-3.5 text-slate-700 dark:text-slate-300">
        <!-- Rendered via JS -->
      </article>
    </div>

    <!-- Thanh chuyển bài phía dưới (Bottom Navigation Bar) -->
    <div class="fixed bottom-0 left-0 right-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-800 py-2.5 px-4">
      <div class="max-w-xl mx-auto flex items-center justify-between gap-2">
        <button id="btnPrevQuestion" onclick="stepQuestion(-1)" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-700 font-bold text-xs text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 active:scale-95 transition">
          <i class="fa-solid fa-chevron-left text-[10px]"></i>
          <span>Câu trước</span>
        </button>

        <button onclick="goHome()" class="w-12 h-10 flex items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:text-primary-600 active:scale-95 transition" title="Trang danh mục">
          <i class="fa-solid fa-list"></i>
        </button>

        <button id="btnNextQuestion" onclick="stepQuestion(1)" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-md shadow-primary-500/20 active:scale-95 transition">
          <span>Câu tiếp theo</span>
          <i class="fa-solid fa-chevron-right text-[10px]"></i>
        </button>
      </div>
    </div>
  </main>

  <!-- Thông báo sao chép -->
  <div id="toastMessage" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2 bg-slate-900/90 text-white text-xs rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300">
    Đã sao chép đáp án thành công!
  </div>

  <!-- ==================== CƠ SỞ DỮ LIỆU ĐỀ THI & LOGIC ==================== -->
  <script>
    const examQuestions = [
      {
        id: 1,
        title: "Trình tự kiểm tra, chuẩn bị khởi động và các bước khởi động hệ thống dầu bôi trơn?",
        score: "3.0đ",
        category: "tuabin",
        categoryName: "Tuabin & Dầu",
        content: `
          <h4 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base">I. Trình tự kiểm tra, chuẩn bị khởi động</h4>
          <p>Chuẩn bị khởi động hệ thống dầu bôi trơn được tiến hành đồng thời với việc chuẩn bị vận hành Tuabin. Trước khi khởi động, công tác chuẩn bị sau phải hoàn thành:</p>
          <ul class="list-disc pl-5 space-y-1">
            <li>Kiểm tra tất cả các công việc sửa chữa của hệ thống đã được kết thúc, khiếm khuyết được loại bỏ, phiếu công tác đã khóa.</li>
            <li>Kiểm tra bằng mắt các thiết bị: vệ sinh khu vực sạch sẽ, mặt bích kết nối, van chặn, van một chiều tốt, sẵn sàng khởi động.</li>
            <li>Các thiết bị đo lường, điều khiển của hệ thống dầu bôi trơn các ổ đỡ Tuabin - Máy phát phải đưa vào vận hành và kiểm tra.</li>
            <li>Chất lượng dầu trong bể dầu chính phải được kiểm tra lấy mẫu (do Hóa thực hiện), đảm bảo đạt yêu cầu.</li>
            <li>Mức dầu bể chính ở mức làm việc bình thường. Nhiệt độ dầu trong bể không nhỏ hơn 21℃.</li>
            <li>Mạch điều khiển, tự động, bảo vệ, liên động và tín hiệu cảnh báo đã được cấp điện.</li>
            <li>Kiểm tra chức năng hệ thống cảnh báo ở phòng điều khiển khi đạt giới hạn mức bể dầu.</li>
            <li>Lượng dầu bổ sung sẵn sàng; Động cơ và thiết bị đã cấp điện. Nước làm mát cấp cho bộ làm mát dầu đầy đủ.</li>
          </ul>

          <h4 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base mt-4">II. Các bước khởi động hệ thống</h4>
          <p class="text-xs italic text-slate-500">Máy trưởng và Máy phó phối hợp thực hiện theo trình tự:</p>
          <div class="space-y-2 mt-2">
            <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800">
              <strong class="text-primary-600 dark:text-primary-400">Bước 1:</strong> Xác nhận chế độ điều khiển quạt hút khí bể dầu ở “Manu”, Máy trưởng kích xác nhận quạt cần chạy, Máy phó đứng tại chỗ quạt ngoài công trường.
            </div>
            <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800">
              <strong class="text-primary-600 dark:text-primary-400">Bước 2:</strong> Máy trưởng kích khởi động quạt hút khí trên DCS, kiểm tra thông số dòng điện; Máy phó kiểm tra tại chỗ: âm thanh, độ rung, áp lực đầu đẩy.
            </div>
            <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800">
              <strong class="text-primary-600 dark:text-primary-400">Bước 3:</strong> Xác nhận chế độ điều khiển bơm dầu bôi trơn ở “Man”. Máy trưởng kích xác nhận bơm cần chạy, Máy phó đứng tại vị trí bơm công trường.
            </div>
            <div class="p-2.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-800">
              <strong class="text-primary-600 dark:text-primary-400">Bước 4:</strong> Máy trưởng khởi động bơm trên DCS; kiểm tra áp lực, nhiệt độ dầu bình thường; xác nhận dầu đến các gối đỡ qua kính thăm dầu. Đưa quạt hút và bơm dầu còn lại về chế độ dự phòng liên động.
            </div>
          </div>
        `
      },
      {
        id: 2,
        title: "Các trường hợp dừng khẩn cấp bơm cấp và thao tác khi dừng sự cố?",
        score: "2.5đ",
        category: "nuoc",
        categoryName: "Nước cấp - Ngưng",
        content: `
          <h4 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base">I. Các trường hợp cần dừng khẩn cấp bơm cấp</h4>
          <ul class="list-disc pl-5 space-y-1">
            <li>Bơm rung, va đập hoặc phát tiếng kêu bất thường mạnh; có dấu hiệu bó kẹt trục.</li>
            <li>Mất nước đầu hút, áp suất hút giảm nghiêm trọng, bơm bị xâm thực hoặc không tạo được áp suất cấp.</li>
            <li>Mất áp suất dầu bôi trơn; nhiệt độ ổ trục tăng đến mức bảo vệ.</li>
            <li>Phớt, đường ống hoặc thân bơm rò rỉ lớn, nguy cơ gây bỏng hay hư hỏng thiết bị.</li>
            <li>Động cơ quá dòng, có khói, mùi khét, cháy hoặc sự cố phần điện.</li>
            <li>Bơm tự ngắt do bảo vệ; xuất hiện sự cố đe dọa an toàn người và thiết bị.</li>
          </ul>

          <h4 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base mt-4">II. Thao tác khi dừng sự cố</h4>
          <ol class="list-decimal pl-5 space-y-1.5">
            <li>Nhấn dừng khẩn cấp (Emergency Stop) hoặc thực hiện lệnh dừng theo quy trình, báo ngay cho Máy trưởng/Trưởng kíp. Nếu có cháy/nổ, ưu tiên cứu người và ứng cứu khẩn cấp.</li>
            <li>Xác nhận bơm đã dừng, kiểm tra áp suất, lưu lượng nước cấp. Theo dõi chặt mực nước bao hơi, áp suất lò hơi.</li>
            <li>Khởi động đưa bơm dự phòng vào làm việc theo quy trình; tuyệt đối không khởi động lại bơm vừa sự cố khi chưa xác định rõ nguyên nhân.</li>
            <li>Cô lập bơm sự cố bằng các van và cắt nguồn điện theo phiếu cô lập. Không đóng van hút/van cấp tùy tiện khi chưa xác nhận trạng thái.</li>
            <li>Nếu không duy trì được nước cấp cho lò, phải thực hiện giảm tải hoặc dừng lò sự cố theo quy trình.</li>
            <li>Ghi nhật ký vận hành thời điểm, tín hiệu bảo vệ, thông số trước/sau khi dừng; bàn giao sửa chữa.</li>
          </ol>
        `
      },
      {
        id: 3,
        title: "Trình tự tách 01 nhánh bình ngưng ra khỏi vận hành và biện pháp an toàn trước khi làm việc?",
        score: "2.5đ",
        category: "binhngung",
        categoryName: "Bình ngưng & Khí",
        content: `
          <h4 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base">I. Trình tự tách nhánh bình ngưng</h4>
          <ol class="list-decimal pl-5 space-y-1">
            <li>Xác định đúng nhánh cần tách, kiểm tra điều kiện vận hành nhánh còn lại và báo các vị trí liên quan.</li>
            <li>Giảm tải tổ máy phù hợp với mức suy giảm chân không bình ngưng, chờ tải và thông số ổn định.</li>
            <li>Khởi động đưa bơm hút chân không thứ hai vào làm việc song song.</li>

                <tr><td class="border p-1.5 bg-slate-50 dark:bg-slate-800 font-sans">Tốc độ quay định mức</td><td class="border p-1.5">1493 v/phút</td></tr>
                <tr><td class="border p-1.5 bg-slate-50 dark:bg-slate-800 font-sans">Áp suất làm việc định mức / Max</td><td class="border p-1.5 font-bold">9 bar / 10 bar</td></tr>
                <tr><td class="border p-1.5 bg-slate-50 dark:bg-slate-800 font-sans">Dung lượng dầu bôi trơn</td><td class="border p-1.5">85 Lít</td></tr>
                <tr><td class="border p-1.5 bg-slate-50 dark:bg-slate-800 font-sans">Nhiệt độ khí đầu ra cấp áp thấp (LP)</td><td class="border p-1.5">160 ÷ 180℃</td></tr>
                <tr><td class="border p-1.5 bg-slate-50 dark:bg-slate-800 font-sans">Nhiệt độ khí đầu ra cấp áp cao (HP)</td><td class="border p-1.5">140 ÷ 175℃</td></tr>
                <tr><td class="border p-1.5 bg-slate-50 dark:bg-slate-800 font-sans">Áp suất bộ làm mát trung gian (tải)</td><td class="border p-1.5">1.8 ÷ 2.6 bar</td></tr>
                <tr><td class="border p-1.5 bg-slate-50 dark:bg-slate-800 font-sans">Nhiệt độ khí đầu ra cuối cùng</td><td class="border p-1.5">~ 25℃</td></tr>
                <tr><td class="border p-1.5 bg-slate-50 dark:bg-slate-800 font-sans">Nhiệt độ nước làm mát vào / ra</td><td class="border p-1.5">&lt; 40℃ / &lt; 50℃</td></tr>
              </tbody>
            </table>
          </div>

          <h4 class="font-bold text-slate-900 dark:text-white text-sm sm:text-base mt-4">II. Vai trò của các thiết bị trong máy nén khí</h4>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs my-2">
            <div class="p-2 border border-slate-200 dark:border-slate-800 rounded-lg"><strong>Bộ lọc khí:</strong> Lọc sạch bụi bẩn không khí trước khi vào đầu nén.</div>
            <div class="p-2 border border-slate-200 dark:border-slate-800 rounded-lg"><strong>Cấp nén áp thấp:</strong> Nén không khí sơ cấp lần 1 lên áp lực trung gian.</div>
            <div class="p-2 border border-slate-200 dark:border-slate-800 rounded-lg"><strong>Bộ làm mát trung gian:</strong> Giảm nhiệt độ khí sau cấp 1 trước khi sang cấp 2 để tiết kiệm công nén.</div>
            <div class="p-2 border border-slate-200 dark:border-slate-800 rounded-lg"><strong>Cấp nén áp cao:</strong> Nén không khí lần 2 đạt tới áp suất làm việc định mức.</div>
            <div class="p-2 border border-slate-200 dark:border-slate-800 rounded-lg"><strong>Bộ làm mát cuối:</strong> Làm mát khí nén đầu ra đưa về nhiệt độ môi trường.</div>
            <div class="p-2 border border-slate-200 dark:border-slate-800 rounded-lg"><strong>Bẫy nước (Tách nước):</strong> Tách và tự động xả nước ngưng đọng ra khỏi khí nén.</div>
            <div class="p-2 border border-slate-200 dark:border-slate-800 rounded-lg"><strong>Elektronikon:</strong> Hệ thống vi xử lý giám sát, điều khiển tải/không tải và bảo vệ.</div>
            <div class="p-2 border border-slate-200 dark:border-slate-800 rounded-lg"><strong>Van an toàn:</strong> Tự động xả áp khi áp lực vượt quá giới hạn thiết kế.</div>
          </div>
        `
      }
    ];

    // TRẠNG THÁI TOÀN CỤC
    let activeFilter = 'all';
    let activeSearch = '';
    let currentQIndex = 0;

    // KHỞI ĐỘNG KHI TẢI TRANG
    document.addEventListener('DOMContentLoaded', () => {
      // Nhận diện Theme đã lưu
      if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
      }

      // Xử lý nút Back của điện thoại / Trình duyệt (History API)
      window.addEventListener('popstate', (e) => {
        if (e.state && e.state.page === 'reader') {
          renderReaderPage(e.state.qId, false);
        } else {
          renderCatalogPage(false);
        }
      });

      renderCatalog();
    });

    // ĐỔI GIAO DIỆN SÁNG / TỐI
    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      const icon = document.getElementById('themeIcon');
      if (isDark) {
        icon.classList.replace('fa-moon', 'fa-sun');
      } else {
        icon.classList.replace('fa-sun', 'fa-moon');
      }
    }

    // HIỂN THỊ DANH MỤC CÂU HỎI Ở NGOÀI TRANG CHỦ
    function renderCatalog() {
      const catalogEl = document.getElementById('catalogList');
      const filtered = examQuestions.filter(item => {
        const matchCategory = (activeFilter === 'all') || (item.category === activeFilter);
        const matchSearch = activeSearch === '' || 
          item.title.toLowerCase().includes(activeSearch) ||
          item.id.toString() === activeSearch ||
          item.content.toLowerCase().includes(activeSearch);
        return matchCategory && matchSearch;
      });

      document.getElementById('labelTotalVisible').innerText = `Hiển thị ${filtered.length} / 23 câu hỏi`;

      if (filtered.length === 0) {
        catalogEl.innerHTML = `
          <div class="text-center py-12 text-slate-400">
            <i class="fa-solid fa-file-circle-question text-3xl mb-2 opacity-60"></i>
            <p class="text-xs">Không tìm thấy câu hỏi phù hợp.</p>
            <button onclick="resetSearch()" class="mt-2.5 px-3 py-1.5 text-xs font-bold bg-primary-50 text-primary-600 dark:bg-primary-950 dark:text-primary-300 rounded-lg">Xóa tìm kiếm</button>
          </div>
        `;
        return;
      }

      catalogEl.innerHTML = filtered.map(item => `
        <div 
          onclick="openReader(${item.id})"
          class="p-3.5 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-sm hover:border-primary-400 dark:hover:border-primary-500 cursor-pointer active:scale-[0.99] transition-all flex items-start gap-3"
        >
          <div class="shrink-0 w-7 h-7 rounded-lg bg-primary-50 dark:bg-primary-950 text-primary-700 dark:text-primary-300 font-bold text-xs flex items-center justify-center border border-primary-200/50 dark:border-primary-800/50">
            ${item.id}
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between gap-1 mb-1">
              <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${item.categoryName}</span>
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">${item.score}</span>
            </div>
            <h3 class="text-xs sm:text-sm font-semibold text-slate-900 dark:text-slate-100 leading-snug line-clamp-2">
              ${item.title}
            </h3>
          </div>
          <div class="shrink-0 self-center text-slate-300 dark:text-slate-600 text-xs">
            <i class="fa-solid fa-chevron-right"></i>
          </div>
        </div>
      `).join('');
    }

    // CHỌN CHUYÊN ĐỀ
    function selectCategory(catKey, btn) {
      activeFilter = catKey;
      document.querySelectorAll('.cat-pill').forEach(pill => {
        pill.classList.remove('active-pill', 'bg-primary-600', 'text-white', 'border-primary-600');
        pill.classList.add('border-slate-200', 'dark:border-slate-800', 'bg-white', 'dark:bg-slate-900', 'text-slate-600', 'dark:text-slate-300');
      });
      btn.classList.add('active-pill', 'bg-primary-600', 'text-white', 'border-primary-600');
      btn.classList.remove('bg-white', 'dark:bg-slate-900', 'text-slate-600', 'dark:text-slate-300');
      renderCatalog();
    }

    // TÌM KIẾM
    function filterQuestions() {
      const term = document.getElementById('searchBox').value.trim().toLowerCase();
      activeSearch = term;
      document.getElementById('btnResetSearch').classList.toggle('hidden', term === '');
      renderCatalog();
    }

    function resetSearch() {
      document.getElementById('searchBox').value = '';
      activeSearch = '';
      document.getElementById('btnResetSearch').classList.add('hidden');
      renderCatalog();
    }

    // MỞ TRANG ĐỌC ĐÁP ÁN (MỞ TRANG MỚI TRONG CÙNG FILE)
    function openReader(qId) {
      history.pushState({ page: 'reader', qId: qId }, '', `#cau-${qId}`);
      renderReaderPage(qId, false);
    }

    function renderReaderPage(qId, isReplace) {
      const question = examQuestions.find(q => q.id === qId);
      if (!question) return;

      currentQIndex = examQuestions.findIndex(q => q.id === qId);

      // Điền dữ liệu vào trang đọc
      document.getElementById('detailIndexTag').innerText = question.id;
      document.getElementById('detailQuestionTitle').innerText = `Câu ${question.id}: ${question.title}`;
      document.getElementById('detailScoreBadge').innerText = question.score;
      document.getElementById('detailCatBadge').innerText = question.categoryName;
      document.getElementById('detailAnswerBody').innerHTML = question.content;

      // Cập nhật trạng thái nút chuyển câu trước/sau
      document.getElementById('btnPrevQuestion').disabled = currentQIndex === 0;
      document.getElementById('btnPrevQuestion').classList.toggle('opacity-40', currentQIndex === 0);
      document.getElementById('btnNextQuestion').disabled = currentQIndex === examQuestions.length - 1;
      document.getElementById('btnNextQuestion').classList.toggle('opacity-40', currentQIndex === examQuestions.length - 1);

      // Ẩn danh mục, mở view đọc
      document.getElementById('viewCatalog').classList.add('hidden');
      document.getElementById('viewReader').classList.remove('hidden');

      // Đổi header sang trạng thái có nút Home & Back
      document.getElementById('btnHome').classList.remove('hidden');
      document.getElementById('btnBack').classList.remove('hidden');
      document.getElementById('homeBrand').classList.add('hidden');

      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // QUAY VỀ TRANG HOME DANH MỤC
    function goHome() {
      history.pushState({ page: 'home' }, '', window.location.pathname);
      renderCatalogPage(false);
    }

    function goBack() {
      window.history.back();
    }

    function renderCatalogPage() {
      document.getElementById('viewReader').classList.add('hidden');
      document.getElementById('viewCatalog').classList.remove('hidden');

      // Khôi phục header danh mục
      document.getElementById('btnHome').classList.add('hidden');
      document.getElementById('btnBack').classList.add('hidden');
      document.getElementById('homeBrand').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    // CHUYỂN NHANH CÂU TRƯỚC / CÂU TIẾP THEO
    function stepQuestion(direction) {
      const targetIndex = currentQIndex + direction;
      if (targetIndex >= 0 && targetIndex < examQuestions.length) {
        currentQIndex = targetIndex;
        const targetQ = examQuestions[targetIndex];
        history.replaceState({ page: 'reader', qId: targetQ.id }, '', `#cau-${targetQ.id}`);
        renderReaderPage(targetQ.id, true);
      }
    }

    // SAO CHÉP ĐÁP ÁN
    function copyAnswer() {
      const q = examQuestions[currentQIndex];
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = q.content;
      const copyContent = `CÂU HỎI ${q.id}: ${q.title}\n\nĐÁP ÁN:\n${tempDiv.innerText}`;

      navigator.clipboard.writeText(copyContent).then(() => {
        showToast("Đã sao chép đáp án vào bộ nhớ!");
      }).catch(() => {
        showToast("Không thể sao chép");
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMessage');
      toast.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2000);
    }
  </script>
</body>
</html>
